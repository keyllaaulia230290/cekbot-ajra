<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Affiliate AJRA</title>

    <link rel="stylesheet" href="affiliate-login.css">

</head>

<body>

<div class="bg-grid"></div>

<div class="container">

    <a href="affiliate.html" class="back-btn">

        ← Kembali

    </a>

    <div class="login-card">

        <div class="logo">

            🤝

        </div>

        <h1>

            Login Affiliate

        </h1>

        <p>

            Masuk ke dashboard Affiliate AJRA.

        </p>

        <form id="loginForm">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="nama@email.com"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="********"
                    required>

            </div>

            <button
                class="btn-primary"
                type="submit">

                Login

            </button>

        </form>

        <div class="login-footer">

            Belum punya akun?

            <a href="affiliate-register.html">

                Daftar Affiliate

            </a>

        </div>

    </div>

</div>

<script type="module" src="affiliate-login.js"></script>

</body>

</html>
