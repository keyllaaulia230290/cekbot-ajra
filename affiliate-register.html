<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar Affiliate AJRA</title>

    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="affiliate-register.css">

</head>

<body>

<div class="bg-grid"></div>

<div class="container">

    <a href="affiliate.html" class="back-btn">

        ← Kembali

    </a>

    <div class="register-card">

        <div class="logo">

            🤝

        </div>

        <h1>

            Daftar Affiliate AJRA

        </h1>

        <p>

            Lengkapi data di bawah untuk mulai menghasilkan komisi bersama AJRA.

        </p>

        <form id="registerForm">

            <div class="form-group">

                <label>Nama Lengkap</label>

                <input
                type="text"
                id="nama"
                required>

            </div>

            <div class="form-group">

                <label>Username</label>

                <input
                type="text"
                id="username"
                required>

            </div>

        <div class="form-group">

           <label>Email</label>

           <input
            type="email"
            id="email"
            placeholder="nama@email.com"
            required>
        </div>

            <div class="form-group">

                <label>Nomor WhatsApp</label>

                <input
                type="tel"
                id="whatsapp"
                placeholder="628xxxxxxxxxx"
                required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                type="password"
                id="password"
                required>

            </div>

            <div class="form-group">

                <label>Konfirmasi Password</label>

                <input
                type="password"
                id="confirmPassword"
                required>

            </div>

            <label class="checkbox">

                <input
                type="checkbox"
                id="agree">

                <span>

                    Saya telah membaca dan menyetujui syarat & ketentuan Affiliate AJRA.

                </span>

            </label>

            <button
            type="submit"
            class="btn-primary">

                Daftar Sekarang

            </button>

        </form>

        <div class="login-link">

            Sudah punya akun?

            <a href="affiliate-login.html">

                Login

            </a>

        </div>

    </div>

</div>

<script type="module" src="affiliate-register.js"></script>
</body>

</html>
