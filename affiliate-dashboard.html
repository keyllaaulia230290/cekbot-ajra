<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Affiliate</title>

<link rel="stylesheet" href="affiliate-dashboard.css">

</head>

<body>

<div class="bg-grid"></div>

<div class="container">

<header class="topbar">

    <div class="logo">

        🤝 AJRA Affiliate

    </div>

    <button id="logoutBtn" class="logout-btn">

        Logout

    </button>

</header>

<section class="hero">

    <div>

        <h1>

            Halo,
            <span id="affiliateName">Loading...</span> 👋

        </h1>

        <p>

            Selamat datang kembali di Dashboard Affiliate AJRA.

        </p>

    </div>

</section>

<section class="stats">

    <div class="card">

        <span>💰 Total Komisi</span>

        <h2 id="komisi">Rp0</h2>

    </div>

    <div class="card">

        <span>👥 Total Referral</span>

        <h2 id="referral">0</h2>

    </div>

    <div class="card">

        <span>⏳ Pending</span>

        <h2 id="pending">Rp0</h2>

    </div>

    <div class="card">

        <span>💳 Withdraw</span>

        <h2 id="withdraw">Rp0</h2>

    </div>

</section>

<section class="dashboard-grid">

<div class="card">

<h3>

🔗 Referral

</h3>

<input
id="referralLink"
readonly>

<button
id="copyReferral"
class="btn-primary">

Salin Link Referral

</button>

<button
id="withdrawBtn"
class="btn-primary">

💸 Request Withdraw

</button>

</div>

<div class="card">

<h3>

🏆 Rank

</h3>

<h2 id="rank">

Bronze

</h2>

<div class="progress">

<div
id="progressBar">

</div>

</div>

<p>

Menuju Silver

</p>

</div>

</section>

<section class="card">

<h3>

📜 Riwayat Komisi

</h3>

<table>

<thead>

<tr>

<th>Tanggal</th>

<th>Keterangan</th>

<th>Nominal</th>

</tr>

</thead>

<tbody id="historyTable">

<tr>

<td colspan="3">

Belum ada data.

</td>

</tr>

</tbody>

</table>

</section>

</div>

<script type="module" src="affiliate-dashboard.js"></script>

</body>

</html>
